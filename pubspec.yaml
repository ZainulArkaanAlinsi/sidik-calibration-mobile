name: sidik_calibration
description: "Aplikasi kalibrasi alat ukur & sertifikat digital PT Sidik (teknisi & admin, satu APK)."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+2

environment:
  sdk: ^3.11.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  http: ^1.6.0

  # Realtime sync (spec poin 12D): websocket protokol Pus./Reverb, pure-Dart
  # biar lintas platform (mobile + desktop) & bisa di-widget-test tanpa native.
  web_socket_channel: ^3.0.1

  # i18n (dwibahasa ID/EN). `intl` versinya di-pin oleh flutter_localizations,
  # jadi pakai `any` biar `flutter pub get` yang nyocokin.
  flutter_localizations:
    sdk: flutter
  intl: any

  # Nyimpen pilihan bahasa biar nggak balik ke default tiap app dibuka.
  shared_preferences: ^2.3.2

  # Ambil foto profil dari galeri/kamera HP masing-masing, plus jepretan lembar
  # kerja buat dipindai OCR lokal (`pindai_lembar.dart`). Cukup sekali jepret —
  # yang meratakan & memotong per sel jalan di HP sesudah fotonya diambil.
  image_picker: ^1.1.2

  path_provider: ^2.1.6
  open_filex: ^4.7.0

  # Baca versi & nomor build yang BENAR-BENAR terpasang di HP ini.
  # Tanpa ini aplikasi cuma tahu versi yang ditulis di pubspec waktu
  # dikompilasi — dan itu bukan hal yang sama: rilis CI menimpanya lewat
  # `--build-name`/`--build-number`, jadi angka di pubspec justru selalu
  # SALAH buat APK yang dipegang teknisi.
  package_info_plus: ^8.1.1

  # Bedakan WiFi dari data seluler.
  #
  # Bukan pemanis: pemutakhiran diunduh DIAM-DIAM di latar, dan menghabiskan
  # 50 MB kuota teknisi yang sedang di lokasi pelanggan tanpa dia tahu itu
  # lebih mengganggu daripada banner yang dia tutup sendiri. Unduhan latar
  # cuma jalan di jaringan tak-berbayar; di seluler tombolnya tetap ada,
  # cuma keputusannya dikembalikan ke dia.
  connectivity_plus: ^6.1.0

  # Milih file .xlsx buat Import Excel (spesifikasi poin 12C). `image_picker`
  # yang udah ada cuma bisa gambar, jadi nggak kepakai di sini.
  file_picker: ^8.1.7
  qr_flutter: ^4.1.0

  # --- Pindai lembar kerja (OCR LOKAL) ---
  #
  # Dua paket ini yang bikin angka lembar kerja kebaca TANPA fotonya keluar dari
  # HP: nggak ada biaya per foto, jalan tanpa sinyal (lab pelanggan sering nggak
  # ada), dan citra pelanggan nggak pernah nyampe pihak ketiga. Bandingannya
  # jalur AI Vision yang lama — foto naik ke Google, ada biaya, butuh sinyal.
  #
  # `google_mlkit_text_recognition` jalan sepenuhnya di perangkat (model-nya
  # ikut Google Play Services). Yang DILARANG masuk sini: SDK OCR apa pun yang
  # ngirim citra ke server orang, atau yang butuh API key ke layanan luar.
  google_mlkit_text_recognition: ^0.15.0

  # QR versi lembar (`{template_id}|v{versi}`). Server NOLAK seluruh pindai
  # kalau `qr.terbaca` bukan `true`, dan itu penjagaan yang bener: QR-nya
  # satu-satunya cara sistem tau lembar mana & revisi ke berapa yang lagi
  # difoto — dua formulir Rev.4 & Rev.5 mirip di mata orang, beda di mata
  # koordinat. Jadi QR-nya WAJIB dibaca dari fotonya sendiri, bukan disalin
  # dari respons template (itu sama dengan ngaku baca sesuatu yang nggak
  # pernah dilihat). Sama kayak text recognition: sepenuhnya on-device.
  google_mlkit_barcode_scanning: ^0.14.0

  # Baca & potong citra di Dart murni — warp perspektif dari 4 marker sudut,
  # lalu motong per sel dari koordinat template. Dipakai juga buat ambang gelap
  # waktu nyari markernya.
  #
  # Dipilih daripada OpenCV: markernya sengaja kotak hitam pejal (lihat
  # `ocr:cetak-lembar` di backend), dan deteksinya cuma butuh ambang + titik
  # berat gumpalan. Nyeret OpenCV ke APK buat itu doang nambah puluhan MB.
  image: ^4.3.0

  # Buka WhatsApp (wa.me) & Gmail (mailto:) buat bagiin sertifikat. Dipilih
  # daripada share_plus: yang dibutuhin nembak SATU aplikasi tertentu dengan
  # pesan yang udah disiapin, bukan buka lembar "bagikan ke..." bawaan OS.
  url_launcher: ^6.3.1
  flutter_local_notifications: ^22.3.0
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Uji DI PERANGKAT. ML Kit (teks & QR) nggak bisa jalan di `flutter test`:
  # modelnya hidup di sisi native, jadi satu-satunya cara mbuktiin dia beneran
  # kebaca itu jalanin di HP/emulator — `flutter test integration_test`.
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # Aktifkan generator localization (baca l10n.yaml + lib/l10n/*.arb →
  # AppLocalizations). Wajib buat dwibahasa.
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Inter — font di desain Titanium (Project-PT-Sidik/gambar/titanium_light).
  # Sengaja dibundel di APK, bukan pakai `google_fonts` yang ngunduh waktu
  # runtime: teknisi di lapangan sinyalnya nggak nentu, font nggak boleh
  # gagal muncul. Lisensi SIL OFL (assets/fonts/LICENSE-Inter.txt).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

  # Logo resmi PT Sidik (dipakai di badge brand layar auth).
  assets:
    - assets/images/logo_pt_sidik.png
    # Lembar cetak bermarker buat uji di perangkat (`integration_test`).
    # Ikut dibundel karena aset uji cuma bisa dibaca lewat `rootBundle` waktu
    # jalan di HP. ~140 KB, dan berkasnya SATU — yang dipakai `flutter test`
    # juga berkas ini, biar nggak ada dua salinan yang bisa beda diam-diam.
    - test/assets/lembar-conductivity-v1.png
    - test/assets/geometri-conductivity-v1.json
    # Tabel hasil Viscometer terisi angka sesi master — buat menguji jalur
    # "FOTO TABEL INI" dengan ML Kit ASLI (`integration_test`). Jalur itu
    # nggak bermarker & nggak ber-QR, jadi lembar conductivity di atas nggak
    # bisa dipakai: yang diuji di sini pemetaan lewat label kolom & nomor
    # Repeat, bukan geometri sel.
    - test/assets/tabel-viscometer-uji.png
    - test/assets/viscometer-bentuk-hasil.json

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
