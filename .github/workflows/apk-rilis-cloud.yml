# Tiap ada perubahan yang masuk, APK-nya kebangun ulang sendiri — nggak perlu
# ada yang inget buat build manual.
#
# Bedanya sama "Paket tes (mock, tanpa server)": yang itu offline dan datanya
# palsu, buat nyoba tampilan. Yang ini nyambung ke server Render beneran, buat
# uji coba di lokasi.
#
# ALAMAT SERVERNYA NGGAK DITULIS DI SINI. Repo ini publik, jadi URL-nya diambil
# dari repository variable `API_BASE_URL`. Pasangnya sekali:
#   Settings → Secrets and variables → Actions → Variables → New repository
#   variable → nama: API_BASE_URL, nilai: https://<url>.onrender.com
# (Variable, BUKAN Secret. Secret disensor jadi `***` di log, dan nilainya ikut
#  ketanam ke APK lewat --dart-define — jadi nyensor di log nggak nambah aman,
#  cuma bikin nggak bisa dibaca waktu nyari sebab error.)
name: APK rilis (nyambung server)

on:
  push:
    branches:
      - main
      - chore/apk-rilis-cloud
  # Biar bisa dipicu manual juga, mis. abis ganti URL server tanpa ganti kode.
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.44.6

# Dua merge yang berdekatan memicu DUA build sekaligus, dan itu bukan cuma
# boros — dua-duanya menerbitkan Release dengan `--latest`, jadi yang SELESAI
# BELAKANGAN yang menang. Build commit lama sering selesai belakangan (ukuran
# APK-nya beda-beda), dan begitu dia menang, `GET /releases/latest` — yang
# dibaca `/api/app/versi-terbaru` — memulangkan versi yang lebih TUA daripada
# yang barusan terbit.
#
# Akibatnya halus dan membingungkan: teknisi di versi lama ditawari
# pemutakhiran ke rilis yang sudah kesalip, memasangnya, lalu tidak ditawari
# apa-apa lagi walau masih ketinggalan satu rilis.
#
# Ketahuan 24 Agu 2026 waktu merge #93 dan #94 berselang semenit dan run 36 &
# 37 jalan berbarengan. Aturannya sama dengan `periksa-pr.yml`: yang penting
# commit TERAKHIR — build yang lama dibatalkan, dan kodenya toh sudah termuat
# di build yang baru.
concurrency:
  group: apk-rilis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest

    # Perlu buat menerbitkan GitHub Release. Bawaan runner cuma `contents:read`,
    # dan tanpa baris ini langkah rilis gagal 403 SESUDAH APK-nya kebangun —
    # gagal di ujung, waktu semuanya sudah terlanjur jalan sepuluh menit.
    permissions:
      contents: write
    name: build apk

    env:
      # Konteks `secrets` nggak bisa dipakai langsung di `if:` sebuah step,
      # jadi jawabannya diturunin sekali di sini — `env` boleh baca `secrets`,
      # dan `if:` boleh baca `env`. Nilainya string 'true'/'false', bukan
      # boolean, karena semua nilai `env` di Actions itu string.
      #
      # Yang dibocorin cuma "ada apa nggak", bukan isinya.
      PUNYA_KUNCI_FIREBASE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}

      # Dua secret Firebase ini beda peran, dan gampang ketuker:
      #   - GOOGLE_SERVICES_JSON  → ikut MASUK ke dalam APK. Yang bikin
      #     aplikasinya bisa NERIMA push. Isinya (app id, project number, api
      #     key Android) toh kebawa di tiap APK, jadi bukan rahasia dalam arti
      #     sebenarnya — dia Secret cuma karena repo ini publik.
      #   - FIREBASE_SERVICE_ACCOUNT → dipakai runner buat NGIRIM rilis ke
      #     App Distribution. TIDAK ikut ke dalam APK, dan ini rahasia beneran.
      # Satu buat nerima, satu buat ngirim. Yang satu ada tanpa yang lain itu
      # keadaan yang sah.
      PUNYA_GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}

    steps:
      # `fetch-depth: 0` WAJIB, dan bukan optimasi: nomor versi diambil dari
      # JUMLAH COMMIT (lihat langkah "Susun nomor versi"), sementara checkout
      # bawaan cuma menarik satu commit — hitungannya jadi 1. Penjagaan di
      # langkah itu yang menangkap kalau baris ini kehapus.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Gagal di sini, di detik pertama, dengan sebab yang jelas. Tanpa
      # penjagaan ini APK-nya tetap kebangun tapi API_BASE_URL-nya kosong —
      # dan nilai kosong bikin AppConfig balik ke bawaan `10.0.2.2`, alamat
      # emulator, yang di HP asli nggak nyambung ke mana-mana.
      #
      # Nilai placeholder ikut ditolak. Cek "tidak kosong" saja tidak cukup:
      # contoh di dokumentasi (`https://<url-render>.onrender.com`) gampang
      # ke-copy mentah-mentah, lolos cek kosong, lalu ketanam ke APK sebagai
      # alamat yang tidak pernah ada — dan gagalnya baru ketahuan di lokasi.
      - name: Pastiin URL server udah dipasang
        env:
          URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::Repository variable API_BASE_URL belum diisi. Lihat komentar di atas berkas workflow ini."
            exit 1
          fi
          case "$URL" in
            *"<"*|*">"*)
              echo "::error::API_BASE_URL masih berisi contoh dari dokumentasi ($URL). Ganti dengan URL backend yang asli."
              exit 1 ;;
            https://*) ;;
            *)
              echo "::error::API_BASE_URL harus mulai dengan https:// (sekarang: $URL)."
              exit 1 ;;
          esac
          case "$URL" in
            */api|*/api/)
              echo "::error::API_BASE_URL jangan pakai /api di belakang — workflow ini yang nambahin sendiri."
              exit 1 ;;
          esac

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter gen-l10n
        continue-on-error: true

      # Kalau test-nya merah, APK-nya nggak usah dibikin. Uji coba di lokasi
      # pakai APK yang test-nya gagal itu buang-buang perjalanan.
      - run: flutter test

      # Tanpa berkas ini APK-nya TETAP KEBANGUN, tapi push notification-nya
      # mati — dan matinya diam-diam, yang bikin dia gampang dikira sudah jalan.
      #
      # Rantainya: `android/app/google-services.json` masuk `.gitignore` (repo
      # ini publik), jadi runner yang checkout bersih nggak punya berkas itu.
      # `Firebase.initializeApp()` di `main.dart` gagal, kegagalannya SENGAJA
      # ditelan (`catch` di `_nyalakanFirebase`) supaya aplikasinya tetap bisa
      # dijalankan orang yang baru clone — lalu FCM nggak pernah ngasih token,
      # dan nggak ada yang bisa didaftarkan ke server. Satu-satunya jejaknya
      # cuma `debugPrint` yang nggak kelihatan di APK release.
      #
      # Yang hilang cuma kabar waktu aplikasi KETUTUP TOTAL. Selama aplikasinya
      # kebuka, websocket Reverb tetap ngabarin — itu sebabnya gejalanya
      # membingungkan: notifikasi "kadang jalan".
      #
      # Nggak ada langkah bersih-bersih sesudahnya, dan itu disengaja: runner
      # GitHub dibuang utuh tiap run selesai, dan nggak ada satu pun langkah di
      # bawah yang ngunggah pohon sumber — artifact-nya cuma berkas .apk.
      # Nambah `rm` cuma nambah baris yang keliatan menjaga sesuatu padahal
      # nggak.
      #
      # Rilis desktop nggak dikasih langkah ini: FCM cuma jalan di Android/iOS
      # (`FcmSumberTokenPush.didukung`), dan di desktop kabarnya lewat websocket
      # Reverb.
      #
      # Masangnya sekali, dari Firebase Console → project `sidik-kalibrasi` →
      # Project settings → app `com.ptsidik.kalibrasi` → Download
      # google-services.json, lalu:
      #   gh secret set GOOGLE_SERVICES_JSON < android/app/google-services.json
      - name: Pasang google-services.json
        if: env.PUNYA_GOOGLE_SERVICES == 'true'
        env:
          ISI: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$ISI" > android/app/google-services.json

          # Gagal di sini kalau isinya kepotong atau kesalin setengah. Tanpa
          # penjagaan ini Gradle-nya yang gagal, dengan pesan soal plugin Google
          # Services yang nggak nyebut sebab sebenarnya — dan orang bakal nyari
          # di tempat yang salah.
          python3 -c "import json,sys; json.load(open('android/app/google-services.json'))" \
            || { echo "::error::Isi secret GOOGLE_SERVICES_JSON bukan JSON yang sah. Pasang ulang: gh secret set GOOGLE_SERVICES_JSON < android/app/google-services.json"; exit 1; }

      - name: Catatan kalau google-services.json belum dipasang
        if: env.PUNYA_GOOGLE_SERVICES != 'true'
        run: |
          echo "::warning::APK ini kebangun TANPA google-services.json, jadi push notification-nya mati — kabar waktu aplikasi ketutup total nggak bakal masuk. Aplikasinya sendiri jalan normal. Pasang secret GOOGLE_SERVICES_JSON buat nyalain (lihat komentar di berkas workflow ini)."

      # `--build-number` bukan kosmetik. Tanpa dia semua rilis mewarisi
      # `version: 1.0.0+2` dari pubspec — dan angka `+2` itu belum pernah naik
      # sejak setup awal. Artinya tiap APK punya versionCode yang SAMA PERSIS,
      # dan itu yang bikin "kok masih yang lama":
      #
      #   - Android nolak masang APK dengan versionCode yang nggak lebih besar
      #     dari yang udah terpasang, dan gagalnya cuma muncul sebagai
      #     "App not installed" tanpa sebab.
      #   - App Tester ngelompokkin rilis per versi, jadi build baru nangkring
      #     di bawah judul yang sama kayak yang lama. Teknisi lihat "sudah
      #     terpasang", nutup aplikasinya, dan tetap megang versi kemarin.
      #
      # Angkanya diambil dari JUMLAH COMMIT (`git rev-list --count HEAD`), naik
      # sendiri tiap ada yang mendarat di `main` — nggak ada yang perlu inget
      # naikkin manual, dan itu justru intinya: yang mesti diinget tiap rilis
      # pasti kelupaan suatu hari.
      #
      # Dulu ini `github.run_number`. Diganti karena angka itu PER-WORKFLOW:
      # jalur APK dan jalur desktop menghitung sendiri-sendiri, jadi commit yang
      # sama terbit sebagai `1.0.84` di HP dan `1.0.0` di Windows. Waktu teknisi
      # lapor "punyaku versi sekian", nggak ada yang bisa diadu antar-platform.
      # Jumlah commit sama di mana pun dia dihitung, jadi dua jalur rilis
      # menghasilkan angka yang identik tanpa perlu saling nunggu.
      #
      # Syaratnya satu, dan sudah terpenuhi waktu ini ditulis: angkanya nggak
      # boleh TURUN. Riwayat `main` di sini lurus dan cuma nambah (semua PR
      # mendarat sebagai satu commit), dan waktu penggantian ini dibuat
      # hitungannya 521 lawan run_number 84 — naik, bukan turun. Yang bisa
      # merusaknya cuma penulisan ulang riwayat `main`; kalau suatu hari itu
      # terpaksa dilakukan, nomor versi ikut jadi taruhannya.
      #
      # `version:` di pubspec sengaja DIBIARIN di `+2`. Itu bikin build lokal
      # selalu berangka lebih kecil daripada build CI, jadi APK hasil coba-coba
      # di laptop nggak bisa nimpa rilis yang dipegang teknisi — kebalikannya
      # yang bahaya, dan diam-diam.
      # `--target-platform android-arm64` motong APK dari ~115 MB jadi ~50 MB.
      #
      # Bawaannya "fat APK": mesin Flutter + SELURUH pustaka native dikemas tiga
      # kali — arm64-v8a, armeabi-v7a, dan x86_64. HP yang masang cuma pakai
      # satu dari tiga; dua sisanya ikut terunduh lalu nganggur di
      # penyimpanan. Buat aplikasi ini beratnya kerasa karena dua model ML Kit
      # (pengenal teks & barcode) ditanam di dalam APK — itu keputusan sadar
      # supaya pindai lembar kerja jalan on-device dan foto pelanggan nggak
      # pernah keluar dari HP, tapi harganya kelipatan tiga kalau ABI-nya nggak
      # dibatasi.
      #
      # arm64-v8a nutup semua HP Android keluaran 2015 ke atas. Yang dikorbanin:
      #   - HP 32-bit yang sangat lama nggak bisa masang. Kalau suatu hari ada
      #     teknisi yang bawa satu, tambahin `,android-arm` di sini — bukan
      #     balikin ke fat APK.
      #   - Emulator x86_64 NGGAK kena: `flutter run` di emulator bangun debug,
      #     dan baris ini cuma nyentuh jalur release.
      # NAMA versi ikut naik, bukan cuma nomor build.
      #
      # Sampai sebelum ini `--build-number` saja yang naik, jadi tiap rilis
      # tetap bernama "1.0.0". Akibatnya teknisi tidak punya cara menyebut versi
      # yang dia pegang selain angka build yang tidak kelihatan di mana-mana,
      # dan pemberitahuan "ada versi baru" di aplikasi tidak punya apa-apa buat
      # dibandingkan — 1.0.0 lawan 1.0.0 selalu terbaca "sudah paling baru".
      #
      # Polanya `MAJOR.MINOR.<nomor build>`:
      #   - MAJOR.MINOR diambil dari `version:` di pubspec, dan itu tetap
      #     URUSAN MANUSIA. Dinaikkan waktu memang ada tonggak (alat baru,
      #     perubahan alur), bukan tiap merge.
      #   - PATCH = jumlah commit di riwayat, naik sendiri tiap ada yang
      #     mendarat — dan angkanya sama persis dengan yang dipakai
      #     `rilis-desktop.yml`, jadi APK & paket desktop dari commit yang sama
      #     bernomor sama.
      #
      # Jadi versinya selalu naik tanpa ada yang perlu diingat, tapi lompatan
      # besarnya tetap bisa disengaja. Dan karena PATCH memakai angka yang sama
      # dengan build number, dua-duanya tidak akan pernah saling bertentangan.
      - name: Susun nomor versi
        id: versi
        run: |
          set -euo pipefail

          # `version: 1.0.0+2` → `1.0.0` → `1.0`
          DASAR=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//' | cut -d'+' -f1)
          MAYOR_MINOR=$(cut -d'.' -f1,2 <<<"$DASAR")

          if [ -z "$MAYOR_MINOR" ]; then
            echo "::error::Gagal membaca 'version:' dari pubspec.yaml."
            exit 1
          fi


          NOMOR_BUILD=$(git rev-list --count HEAD)

          # Penjagaan buat fetch-depth yang kelupaan. Checkout bawaan cuma
          # menarik SATU commit, jadi hitungannya jadi 1 — dan angka 1 lolos
          # semua langkah di bawah tanpa satu pun keluhan. Yang merah baru HP
          # teknisi: Android nolak masang APK yang versionCode-nya turun dari
          # 500-an ke 1, dengan pesan "App not installed" yang nggak nyebut
          # sebabnya sama sekali.
          if [ "$NOMOR_BUILD" -lt 100 ]; then
            echo "::error::Jumlah commit kebaca $NOMOR_BUILD — kekecilan, hampir pasti checkout-nya dangkal. Pastikan fetch-depth: 0 masih terpasang di langkah checkout."
            exit 1
          fi

          NAMA_VERSI="${MAYOR_MINOR}.${NOMOR_BUILD}"
          echo "nama=$NAMA_VERSI" >> "$GITHUB_OUTPUT"
          echo "build=$NOMOR_BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=v${NAMA_VERSI}+${NOMOR_BUILD}" >> "$GITHUB_OUTPUT"
          echo "Versi rilis ini: $NAMA_VERSI (build $NOMOR_BUILD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Build APK
        env:
          NOMOR_BUILD: ${{ steps.versi.outputs.build }}
          NAMA_VERSI: ${{ steps.versi.outputs.nama }}
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --build-name="$NAMA_VERSI" \
            --build-number="$NOMOR_BUILD" \
            --dart-define=APP_ENV=prod \
            --dart-define=API_BASE_URL="${{ vars.API_BASE_URL }}/api"

          # Ukurannya dicetak ke ringkasan run. Kalau suatu hari ada yang
          # nambah dependensi berat, kenaikannya kelihatan di sini — bukan baru
          # kerasa sama teknisi yang unduhnya lewat data lapangan.
          UKURAN=$(du -m build/app/outputs/flutter-apk/app-release.apk | cut -f1)
          echo "APK arm64: ${UKURAN} MB (build $NOMOR_BUILD)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: sidik-cloud-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      # GitHub Release: tautan unduh yang ALAMATNYA TETAP.
      #
      # Artifact di atas tidak bisa dipakai buat itu, dan bukan cuma soal
      # kenyamanan: artifact butuh login GitHub buat diunduh, umurnya 30 hari,
      # dan bentuknya zip — tiga-tiganya bikin dia mustahil dipakai aplikasi
      # buat memperbarui dirinya sendiri di HP teknisi.
      #
      # Release-nya yang dibaca `GET /api/app/versi-terbaru` di repo API.
      # Endpoint itu sengaja menumpang ke sini supaya tidak ada dua tempat yang
      # harus dijaga tetap sama.
      #
      # APK-nya diberi nama berversi, bukan `app-release.apk`: yang terunduh ke
      # folder Download teknisi harus bisa dibedakan dari unduhan sebelumnya —
      # tiga berkas bernama sama persis bikin dia memasang yang mana saja.
      #
      # CATATAN KEAMANAN, sengaja ditulis di sini biar tidak hilang: repo ini
      # PUBLIK, jadi APK di Release bisa diunduh siapa pun tanpa login. Isinya
      # tidak memuat rahasia (lihat catatan GOOGLE_SERVICES_JSON di atas) dan
      # tetap butuh akun buat masuk, tapi bedanya nyata dengan App Distribution
      # yang undangan-saja. Kalau suatu hari itu tidak bisa diterima, yang
      # diubah tempat menaruh APK-nya — bukan mengembalikan teknisi ke unduh
      # manual.
      - name: Terbitkan GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.versi.outputs.tag }}
          NAMA_VERSI: ${{ steps.versi.outputs.nama }}
          NOMOR_BUILD: ${{ steps.versi.outputs.build }}
          # Lewat `env`, bukan ditempel ke `run:`. Pesan commit bisa memuat
          # tanda kutip atau `;`, dan yang ditempel `${{ }}` disalin mentah jadi
          # teks skrip sebelum shell-nya jalan — alasan yang sama dengan
          # langkah App Distribution di bawah.
          PESAN: ${{ github.event.head_commit.message || github.sha }}
        run: |
          set -euo pipefail

          BERKAS="sidik-kalibrasi-${NAMA_VERSI}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$BERKAS"

          # Re-run jalan di commit yang SAMA, jadi hitungannya sama, tag-nya
          # bentrok dan
          # `gh release create` gagal. Itu bukan kasus teoretis — riwayat
          # workflow ini sudah memuat `run_attempt: 2`. Gagal di langkah
          # terakhir sesudah sepuluh menit build itu mahal, dan gagalnya cuma
          # karena hal yang seharusnya boleh diulang.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$BERKAS" --clobber
            echo "Release $TAG sudah ada — APK-nya ditimpa." >> "$GITHUB_STEP_SUMMARY"
          else
            gh release create "$TAG" "$BERKAS" \
              --title "$NAMA_VERSI (build $NOMOR_BUILD)" \
              --notes "$PESAN" \
              --latest
            echo "Release $TAG terbit dengan $BERKAS" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Sampai sini APK-nya cuma jadi artifact: harus ada yang buka tab
      # Actions, unduh zip-nya, ekstrak, lalu kirim manual ke tiap teknisi.
      # Langkah di bawah yang bikin "otomatis"-nya beneran nyampe ke HP —
      # App Distribution ngirim notifikasi ke grup `teknisi`, dan yang udah
      # pasang aplikasi App Tester dapat update-nya sendiri.
      #
      # `if` di sini SENGAJA, dan bukan sekadar kehati-hatian: tanpa dia,
      # setiap fork dan setiap checkout yang belum nempel service account
      # bakal merah di langkah terakhir padahal APK-nya sukses kebangun.
      # Yang belum dipasang itu keadaan yang sah, bukan kesalahan — jadi
      # dilewat dengan catatan, bukan digagalin.
      #
      # Kenapa Secret (bukan Variable kayak API_BASE_URL): isi service
      # account itu kunci yang bisa dipakai ngirim rilis atas nama project,
      # dan dia TIDAK ikut ketanam ke APK. Beda persis sama API_BASE_URL,
      # yang nilainya kebawa di dalam biner apa pun yang kita lakuin — itu
      # sebabnya yang satu disensor dan yang satu nggak.
      #
      # Masangnya sekali, dari Firebase Console → Project settings →
      # Service accounts → Generate new private key, lalu:
      #   gh secret set FIREBASE_SERVICE_ACCOUNT < kunci-yang-diunduh.json
      - name: Kirim ke tester (Firebase App Distribution)
        if: env.PUNYA_KUNCI_FIREBASE == 'true'
        env:
          # App ID BUKAN rahasia — nilainya ikut terbawa di dalam setiap APK,
          # jadi aman ditulis di repo publik ini (lihat docs/deploy-firebase.md).
          APP_ID: '1:573275146800:android:6b5ffb7202167a0ccb3bf5'
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
          # Dua nilai di bawah lewat `env`, BUKAN ditempel langsung ke dalam
          # `run:`. Yang ditempel `${{ }}` disalin mentah-mentah jadi teks
          # skrip sebelum shell-nya jalan, jadi pesan commit yang isinya
          # tanda kutip atau `;` bakal kebaca sebagai perintah — dan pesan
          # commit itu bisa datang dari siapa pun yang ngirim PR.
          KUNCI: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # Nomor build ikut ditulis di catatan rilis. Di App Tester dua rilis
          # beruntun sering cuma beda satu kata di pesan commit, dan waktu
          # teknisi lapor "punyaku masih yang lama" nggak ada yang bisa dipakai
          # buat mastiin dia megang yang mana. Angka ini yang bisa diadu.
          CATATAN_RILIS: >-
            build ${{ steps.versi.outputs.build }} ·
            ${{ github.event.head_commit.message || github.sha }}
        run: |
          # Kuncinya ditulis ke berkas, bukan dioper sebagai argumen: argumen
          # kelihatan di daftar proses runner, berkas nggak.
          printf '%s' "$KUNCI" > "$GOOGLE_APPLICATION_CREDENTIALS"

          # Versinya dipatok. `firebase-tools` rilis tiap minggu, dan update
          # yang mendarat sendiri bikin rilis gagal di hari yang nggak ada
          # kaitannya sama perubahan kode kita.
          npm install --global firebase-tools@13

          firebase appdistribution:distribute \
            build/app/outputs/flutter-apk/app-release.apk \
            --app "$APP_ID" \
            --groups "teknisi" \
            --release-notes "$CATATAN_RILIS"

      - name: Catatan kalau belum dipasang
        if: env.PUNYA_KUNCI_FIREBASE != 'true'
        run: |
