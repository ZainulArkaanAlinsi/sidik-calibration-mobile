# Pemeriksaan otomatis tiap pull request: analyze, test, dan build Android.
#
# ## Kenapa ada
#
# Sampai 20 Agu 2026 repo ini NGGAK punya satu pun workflow yang jalan di
# `pull_request` — tiga yang lain (`build-tes-mock`, `apk-rilis-cloud`,
# `rilis-desktop`) semuanya manual/`main`. Akibatnya satu-satunya bukti sebuah
# PR sehat adalah "sudah kucek di laptopku", dan itu bukan bukti yang bisa
# dilihat orang lain.
#
# ## Kenapa build Android ikut, bukan cuma test
#
# Ini bagian yang paling mahal kalau dilewat. Dua kali build Android patah
# TOTAL — aplikasinya nggak bisa dijalankan sama sekali — dan dua-duanya lolos
# karena yang dijalankan cuma `flutter test`, yang nggak pernah menyentuh
# Gradle:
#
#   1. `flutter_local_notifications` menuntut core library desugaring:
#      "Dependency ':flutter_local_notifications' requires core library
#      desugaring". Ketahuan berhari-hari sesudah commit-nya mendarat.
#   2. Plugin `com.google.gms.google-services` dipasang tanpa syarat sementara
#      `google-services.json` masuk `.gitignore`: "File google-services.json is
#      missing." Ketahuan waktu pemiliknya mau menjalankan aplikasinya sendiri.
#
# Runner CI itu checkout bersih tanpa `google-services.json` — persis kondisi
# orang yang baru clone. Jadi job `android` di bawah ini bukan cuma nguji
# Gradle-nya jalan, dia juga yang menjaga aplikasinya tetap bisa dibangun TANPA
# berkas kredensial yang memang nggak pernah di-commit.
#
# ## Kenapa boleh jalan tiap PR
#
# Repo ini publik, dan runner standar GitHub gratis buat repo publik. Jadi
# alasan "biar nggak ngabisin menit CI" yang bikin tiga workflow lain manual
# nggak berlaku di sini.
name: Periksa PR

on:
  pull_request:
  # `main` ikut diperiksa supaya kalau ada yang mendarat lewat push langsung
  # (atau merge yang konfliknya diselesaikan di web), ketahuannya tetap di sini
  # dan bukan di laptop orang.
  push:
    branches: [main]
  workflow_dispatch:

# Push beruntun ke PR yang sama nggak perlu diperiksa satu-satu — yang penting
# commit terakhirnya. Yang lama dibatalin.
concurrency:
  group: periksa-pr-${{ github.ref }}
  cancel-in-progress: true

env:
  # Samain persis sama yang dipakai lokal & workflow lain. Flutter beda minor
  # sering ganti perilaku analyzer, dan CI yang beda versi bikin "hijau di CI,
  # merah di laptop" — kebalikan dari gunanya CI.
  FLUTTER_VERSION: 3.44.6

jobs:
  periksa:
    name: Analyze & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Ditaruh SEBELUM Flutter dipasang: dia cuma butuh bash, jalannya
      # sedetik, dan kalau merah nggak ada gunanya nunggu toolchain lima menit.
      #
      # Yang dijaga: `bikin-keystore-rilis.sh` pernah melahirkan bug yang nggak
      # menghasilkan error — langkah cadangannya menyuruh menjalankan ulang,
      # sementara penjaga "berkas sudah ada" menolak jalan kedua. Kunci sudah
      # lahir di disk, nol secret terpasang, jalan maju ditutup. Perilaku
      # semacam itu nggak boleh dijaga sama ingatan siapa pun.
      - name: Uji skrip keystore
        run: ./tool/uji-bikin-keystore.sh

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Localization di-generate (pubspec `generate: true`); tanpa ini
      # AppLocalizations nggak ada dan analyze-nya penuh error palsu.
      - run: flutter gen-l10n
        continue-on-error: true

      # `--fatal-infos` sengaja NGGAK dipakai: `flutter analyze` polos sudah
      # gagal kalau ada warning/error, dan menaikkannya ke info bikin PR yang
      # sehat merah gara-gara saran gaya penulisan.
      - name: flutter analyze
        run: flutter analyze

      # Reporter-nya sengaja nggak diset: di GitHub Actions `flutter test`
      # otomatis pakai reporter `github`, yang bikin grup lipat per file dan
      # menempelkan anotasi tepat di baris test yang gagal. Menyetel
      # `--reporter expanded` justru membuang keduanya jadi 700-an baris datar.
      - name: flutter test
        run: flutter test

  # Golden diperiksa DI SINI, di macOS, dan cuma di sini.
  #
  # `test/flutter_test_config.dart` menetapkan macOS sebagai platform acuan:
  # PNG di `test/screenshots/` dirasterisasi di sana. Di platform lain ambangnya
  # sengaja dilonggarkan ke 15%, karena beda CoreText lawan FreeType/DirectWrite
  # sendirian sudah 2,5%-4,3% — angka yang nggak bisa dipakai mutusin apa pun.
  #
  # Akibatnya job `periksa` di atas (ubuntu) buta sama pergeseran layout. Sampai
  # 25 Agu 2026 satu-satunya yang melihatnya job rilis desktop, dan itu tempat
  # yang salah karena dia jalan SESUDAH merge: yang kena hukumannya bukan yang
  # ngubah tampilan, tapi lab yang nunggu paketnya. Sekali kejadian, halaman
  # unduh membeku sepuluh hari kerja. Ceritanya lengkap di `rilis-desktop.yml`.
  #
  # Job ini nggak nambah gerbang baru — dia mindahin gerbang yang sudah ada ke
  # waktu PR, selagi yang ngubah masih pegang perubahannya.
  golden:
    name: Golden (macOS)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter gen-l10n
        continue-on-error: true

      - name: flutter test --tags screenshot
        run: flutter test --tags screenshot

      # Tanpa langkah ini kegagalan golden nggak bisa didiagnosa siapa pun yang
      # nggak pegang Mac — dan itu persis yang terjadi selama lima rilis merah
      # beruntun: yang kelihatan cuma angka "7,14%", nggak ada satu piksel pun
      # yang bisa dilihat orangnya.
      #
      # `test/failures/` isinya empat PNG per golden yang gagal:
      #   *_masterImage.png  — yang tersimpan di repo
      #   *_testImage.png    — yang barusan dirender di runner ini
      #   *_isolatedDiff.png & *_maskedDiff.png — bedanya di mana
      #
      # `_testImage.png` sekalian jadi jalan memperbarui golden TANPA Mac:
      # kalau pergeserannya ternyata disengaja, berkas itu yang disalin ke
      # `test/screenshots/`. Pikselnya sama persis dengan hasil
      # `--update-goldens` di mesin ini, karena memang render yang sama.
      - name: Simpan bukti golden yang gagal
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-yang-gagal
          path: test/failures/
          if-no-files-found: warn
          retention-days: 14

  web:
    name: Build web
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter gen-l10n
        continue-on-error: true

      # Kenapa web ikut diperiksa waktu PR, bukan cuma waktu rilis.
      #
      # Sejak bundel web ikut diterbitkan, job `terbitkan` di
      # `rilis-desktop.yml` berbunyi `needs: [build, web]`. Artinya web yang
      # gagal build nggak cuma bikin `/app` nggak terbit — dia MENAHAN SELURUH
      # penerbitan situs, termasuk kedua zip desktop yang sebenarnya baik-baik
      # saja. Halaman unduh bakal membeku di versi lama tanpa ada yang tahu
      # kenapa, persis pola yang sudah pernah kejadian gara-gara satu PNG
      # golden basi (lihat catatan di `rilis-desktop.yml`).
      #
      # Jadi gerbangnya ditaruh di sini, waktu PR — tempat yang mengubah masih
      # pegang perubahannya dan belum ada yang nunggu paketnya.
      #
      # `--base-href` DIIKUTKAN, bukan dilewat: nilainya ikut ke `index.html`,
      # jadi salah di sini ketahuan sekarang, bukan sesudah situsnya terbit
      # putih.
      - name: flutter build web
        run: >
          flutter build web --release
          --base-href=/app/
          --dart-define=PINDAI_LEMBAR=false

      - name: Pastiin bundelnya utuh
        run: |
          test -f build/web/index.html || {
            echo "::error::build/web/index.html nggak ada — bundelnya nggak utuh."
            exit 1
          }
          grep -q '<base href="/app/">' build/web/index.html || {
            echo "::error::base href bukan /app/ — asetnya bakal dicari di akar situs dan halamannya putih."
            exit 1
          }

  android:
    name: Build Android (debug)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter gen-l10n
        continue-on-error: true

      # Runner ini SENGAJA nggak dikasih `google-services.json` — lihat
      # docblock di atas. Kalau suatu hari langkah ini gagal dengan
      # "File google-services.json is missing", artinya plugin Google Services
      # dipasang tanpa syarat lagi di `android/app/build.gradle.kts`; yang
      # dibetulkan penjaganya di situ, BUKAN dengan menaruh berkasnya di CI.
      - name: flutter build apk --debug
        run: flutter build apk --debug
