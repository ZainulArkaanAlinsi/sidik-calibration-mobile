# Bikin paket desktop yang NYAMBUNG SERVER buat Windows & macOS, lalu MENERBITKAN
# sendiri ke halaman unduh Firebase Hosting (lihat docs/deploy-firebase.md).
# Nggak ada lagi zip yang di-copy tangan ke `public/`.
#
# Bedanya sama "Paket tes (mock, tanpa server)": yang itu offline dan datanya
# palsu, cuma buat nyoba tampilan. Yang ini nembak backend beneran.
#
# Kenapa lewat CI, bukan build di laptop:
#   - Windows nggak bisa di-cross-compile dari macOS. Runner `windows-latest`
#     ini satu-satunya cara dapat .exe tanpa pinjam laptop Windows.
#   - macOS ikut sekalian biar dua-duanya keluar dari sumber yang sama, dengan
#     versi Flutter yang sama persis. Kalau macOS dibangun di laptop dan Windows
#     di CI, beda perilaku antar platform jadi susah dilacak sebabnya.
#
# ALAMAT SERVERNYA NGGAK DITULIS DI SINI. Repo ini publik, jadi URL-nya diambil
# dari repository variable `API_BASE_URL` — sama persis kayak apk-rilis-cloud.yml.
#   Settings → Secrets and variables → Actions → Variables → New repository
#   variable → nama: API_BASE_URL, nilai: https://<url>.onrender.com
name: Rilis desktop & web (nyambung server)

# Ikut tiap push ke `main`, sejajar sama jalur APK.
#
# Sebelumnya manual, dengan alasan "dua runner desktop jauh lebih mahal menitnya
# daripada ubuntu". Alasan itu nggak kepakai di sini: repo ini publik, dan
# runner standar GitHub gratis buat repo publik — sama persis kayak yang bikin
# `periksa-pr.yml` boleh jalan tiap PR.
#
# Yang dibeli dengan itu: halaman unduhnya nggak pernah lebih tua dari kodenya.
# Waktu masih manual, `public/` isinya zip yang di-copy tangan dan ketinggalan
# enam hari — dan nggak ada yang tahu sampai ada yang ngeluh versinya beda.
on:
  push:
    branches:
      - main
  workflow_dispatch:

  # Jalur APK boleh dipicu MANUAL, dan komentar di `apk-rilis-cloud.yml` sendiri
  # yang nyebut kasusnya: "abis ganti URL server tanpa ganti kode". Pas itu
  # kejadian nggak ada push ke `main`, jadi workflow ini nggak ikut jalan — dan
  # zip Windows/macOS di halaman unduh tetap bawa API_BASE_URL yang LAMA.
  #
  # Gagalnya diam-diam, dan itu yang bikin mahal: halaman unduhnya kelihatan
  # normal, tombolnya jalan, aplikasinya kebuka — cuma nembak alamat yang udah
  # nggak dipakai. Yang kena teknisi di lokasi, bukan orang yang ngeganti URL.
  #
  # Dibatasi ke dispatch yang SUKSES dan berangkat dari `main` (lihat `if:` di
  # tiap job). Yang lewat push sengaja NGGAK diikutin dari sini: `push: main` di
  # atas sudah menjalankan workflow ini langsung, dan ngikutin dua-duanya bikin
  # tiap merge kebangun dobel.
  workflow_run:
    workflows: ["APK rilis (nyambung server)"]
    types: [completed]

env:
  # Samain persis sama yang dipakai lokal; Flutter beda minor sering ganti
  # perilaku build desktop.
  FLUTTER_VERSION: 3.44.6

jobs:
  build:
    # Lihat `workflow_run` di atas. Yang datang lewat push dilewati di sini,
    # karena `push: main` sudah memicu workflow ini secara langsung.
    #
    # `head_branch` ikut dicek: dispatch dari UI boleh dipilih ref-nya, tapi
    # `workflow_run` selalu menjalankan berkas workflow versi branch bawaan dan
    # checkout-nya pun ke sana. Tanpa cek ini, dispatch dari branch lain bakal
    # ngemas kode `main` lalu MENERBITKANNYA — hasilnya bukan yang dimaksud, dan
    # nggak ada yang kelihatan salah di halaman unduh.
    if: >-
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.event == 'workflow_dispatch'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_branch == 'main')
    strategy:
      # Jangan batalin platform lain cuma gara-gara satu gagal.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nama: windows
          - os: macos-latest
            nama: macos

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.nama }}

    steps:
      # `fetch-depth: 0` WAJIB — sama alasannya dengan `apk-rilis-cloud.yml`:
      # nomor versi diambil dari jumlah commit, dan checkout bawaan cuma
      # menarik satu. Job `web` dan `terbitkan` nggak butuh ini: dua-duanya
      # nggak menyusun nomor versi.
      # `ref` WAJIB disebut, dan ini bukan kehati-hatian berlebihan.
      #
      # Waktu workflow dipicu `workflow_run`, GitHub menyetel `GITHUB_SHA` ke
      # commit TERAKHIR di branch bawaan — bukan ke commit yang dibangun jalur
      # APK. `actions/checkout` memakai nilai itu kalau `ref` dikosongkan. Jadi
      # kalau ada yang mendarat di `main` selagi build APK jalan, paket desktop
      # kebangun dari commit yang BEDA dari APK-nya.
      #
      # Akibatnya persis membatalkan alasan berkas ini diubah: hitungan commit
      # ikut beda, jadi APK dan paket desktop yang terbit bareng justru bernomor
      # beda — kebalikan dari yang mau dijamin. Dan nggak ada yang merah:
      # keduanya sukses, cuma isinya nggak sepasang.
      #
      # Bentuk `A && B || C` itu ternary-nya GitHub Actions. Aman di sini karena
      # `head_sha` selalu terisi pada event `workflow_run`; yang lewat push atau
      # dispatch jatuh ke `github.sha` seperti sebelumnya.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      # Gagal di sini, di detik pertama, dengan sebab yang jelas. Tanpa
      # penjagaan ini paketnya tetap kebangun tapi API_BASE_URL-nya kosong —
      # dan nilai kosong bikin AppConfig balik ke bawaan `10.0.2.2`, alamat
      # emulator Android, yang di desktop nggak nyambung ke mana-mana.
      #
      # Nilai placeholder ikut ditolak. Cek "tidak kosong" saja tidak cukup:
      # contoh di dokumentasi (`https://<url-render>.onrender.com`) gampang
      # ke-copy mentah-mentah, lolos cek kosong, lalu ketanam ke biner sebagai
      # alamat yang tidak pernah ada — dan gagalnya baru ketahuan di lokasi.
      - name: Pastiin URL server udah dipasang
        shell: bash
        env:
          URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::Repository variable API_BASE_URL belum diisi. Lihat komentar di atas berkas workflow ini."
            exit 1
          fi
          case "$URL" in
            *"<"*|*">"*)
              echo "::error::API_BASE_URL masih berisi contoh dari dokumentasi ($URL). Ganti dengan URL backend yang asli."
              exit 1 ;;
            https://*) ;;
            *)
              echo "::error::API_BASE_URL harus mulai dengan https:// (sekarang: $URL)."
              exit 1 ;;
          esac
          case "$URL" in
            */api|*/api/)
              echo "::error::API_BASE_URL jangan pakai /api di belakang — workflow ini yang nambahin sendiri."
              exit 1 ;;
          esac

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Localization di-generate (pubspec `generate: true`); tanpa ini
      # AppLocalizations nggak ada dan build-nya gagal di CI yang bersih.
      - run: flutter gen-l10n
        continue-on-error: true

      # Test-nya merah, paketnya nggak usah dibikin. Ngirim build gagal test ke
      # orang yang nunggu itu bikin mereka ngejar bug yang udah kita tau ada.
      #
      # Kecuali golden (`@Tags(['screenshot'])`) — dan itu bukan kelonggaran,
      # itu mindahin gerbang yang selama ini salah tempat.
      #
      # Golden di repo ini artefak macOS (lihat `test/flutter_test_config.dart`):
      # di macOS ambangnya 0,1%, di luar macOS 15%. Jadi `periksa-pr.yml` yang
      # jalan di ubuntu MEMANG buta sama pergeseran layout, dan satu-satunya
      # tempat golden pernah diperiksa serius justru job rilis ini — yang
      # jalannya sesudah merge.
      #
      # Yang kejadian 24 Agu 2026: screenshot lembar Chlorin bergeser 7,14%
      # gara-gara dua tombol pindai dicabut (PR #97) lalu dipasang lagi
      # (PR #100). Di ubuntu 7,14% masih di bawah 15%, jadi PR-nya hijau dan
      # mendarat. Sesudah itu LIMA rilis desktop beruntun mati di langkah ini.
      #
      # Dan yang mati bukan cuma paketnya: job `terbitkan` nunggu `build`, jadi
      # halaman unduh Firebase membeku di versi 24 Agu 07:50. Zip Windows-nya
      # sendiri kebangun tiap kali dan nangkring di tab Actions, tapi nggak
      # pernah terbit. Semua perbaikan sesudah itu nggak nyampe ke lab — karena
      # sebuah PNG.
      #
      # Screenshot basi bukan bug yang bakal dikejar orang yang nunggu paketnya;
      # dia catatan buat yang ngubah tampilan. Jadi gerbangnya pindah ke
      # `periksa-pr.yml` (job `Golden (macOS)`, waktu PR, ambang 0,1%) — tempat
      # yang ngubah masih pegang perubahannya dan belum ada yang nunggu. Di sini
      # yang menahan paket tinggal test perilaku.
      - run: flutter test --exclude-tags screenshot

      # Nomornya disusun dari sumber yang SAMA dengan jalur APK — jumlah commit
      # — dan itu satu-satunya alasan langkah ini ada.
      #
      # `github.run_number` nggak bisa dipakai buat ini: angkanya per-workflow,
      # jadi commit yang sama dapat angka beda di dua jalur. Sampai sebelum ini
      # akibatnya kelihatan telanjang — APK terbit sebagai `1.0.84` sementara
      # paket Windows dari commit yang sama tetap bernama `1.0.0`, karena di
      # sini cuma `--build-number` yang diset dan `--build-name` nggak pernah.
      # Waktu teknisi lapor "punyaku versi sekian", nggak ada yang bisa diadu.
      #
      # Angkanya DIHITUNG ULANG di sini, bukan dioper dari jalur APK. Dioper
      # berarti jalur ini nunggu jalur APK selesai, padahal dua-duanya sengaja
      # berangkat berbarengan dari `push: main`. Jumlah commit nggak perlu
      # dioper — dia sudah ada di checkout ini sendiri, dan hasilnya identik.
      #
      # `shell: bash` disebut eksplisit: bawaan runner Windows itu PowerShell,
      # dan `grep`/`cut`/`<<<` di bawah nggak ada di sana.
      - name: Susun nomor versi
        id: versi
        shell: bash
        run: |
          set -euo pipefail

          # `version: 1.0.0+2` → `1.0.0` → `1.0`
          DASAR=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//' | cut -d'+' -f1)
          MAYOR_MINOR=$(cut -d'.' -f1,2 <<<"$DASAR")

          if [ -z "$MAYOR_MINOR" ]; then
            echo "::error::Gagal membaca 'version:' dari pubspec.yaml."
            exit 1
          fi

          NOMOR_BUILD=$(git rev-list --count HEAD)

          # Kembaran penjagaan di `apk-rilis-cloud.yml`. Checkout dangkal
          # memulangkan 1, dan angka 1 lolos tanpa keluhan sampai ada yang
          # membandingkan versi desktop dengan versi APK — persis kebingungan
          # yang langkah ini dibuat buat menghabisi.
          if [ "$NOMOR_BUILD" -lt 100 ]; then
            echo "::error::Jumlah commit kebaca $NOMOR_BUILD — kekecilan, hampir pasti checkout-nya dangkal. Pastikan fetch-depth: 0 masih terpasang di langkah checkout."
            exit 1
          fi

          echo "nama=${MAYOR_MINOR}.${NOMOR_BUILD}" >> "$GITHUB_OUTPUT"
          echo "build=$NOMOR_BUILD" >> "$GITHUB_OUTPUT"
          echo "Versi paket ${{ matrix.nama }}: ${MAYOR_MINOR}.${NOMOR_BUILD} (build ${NOMOR_BUILD})" >> "$GITHUB_STEP_SUMMARY"

      - name: Build windows
        if: matrix.nama == 'windows'
        run: >
          flutter build windows --release
          --build-name=${{ steps.versi.outputs.nama }}
          --build-number=${{ steps.versi.outputs.build }}
          --dart-define=APP_ENV=prod
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}/api

      - name: Build macos
        if: matrix.nama == 'macos'
        run: >
          flutter build macos --release
          --build-name=${{ steps.versi.outputs.nama }}
          --build-number=${{ steps.versi.outputs.build }}
          --dart-define=APP_ENV=prod
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}/api

      # SELURUH isi folder Release yang dizip, bukan .exe-nya doang: DLL Flutter
      # dan folder `data/` (aset, font, ICU) wajib ikut sebelahan. Tanpa itu
      # app-nya mati begitu diklik, tanpa pesan apa pun.
      - name: Bungkus windows
        if: matrix.nama == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
                           -DestinationPath sidik-windows.zip

      # `ditto`, bukan `zip` biasa dan bukan upload-artifact langsung ke .app:
      # bundel .app isinya symlink & bit executable, dan dua cara itu ngerusak
      # keduanya — hasil unduhannya nggak bisa dibuka di Mac tujuan.
      - name: Bungkus macos
        if: matrix.nama == 'macos'
        run: |
          cd build/macos/Build/Products/Release
          APP=$(ls -d *.app | head -1)
          ditto -c -k --keepParent "$APP" "$GITHUB_WORKSPACE/sidik-macos.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: sidik-desktop-${{ matrix.nama }}
          path: sidik-${{ matrix.nama }}.zip
          if-no-files-found: error
          retention-days: 30

  # Bundel web, dilayani di SUBPATH `/app` situs yang sama.
  #
  # ## Kenapa numpang workflow ini, bukan workflow sendiri
  #
  # `firebase deploy` MENGGANTI seluruh isi situs. Dua workflow yang sama-sama
  # men-deploy situs ini berarti yang jalan belakangan menghapus punya yang
  # duluan — halaman unduh hilang waktu web terbit, atau sebaliknya, tergantung
  # siapa yang selesai duluan. Jadi bundelnya dibangun di sini dan diterbitkan
  # sekali lewat job `terbitkan` di bawah, bareng kedua zip desktop.
  #
  # ## Yang MATI di web, dan kenapa itu disengaja
  #
  # Pindai lembar (OCR + QR) jalan lewat ML Kit, dan ML Kit nggak punya
  # implementasi web sama sekali — tombolnya bakal ada tapi meledak
  # `MissingPluginException` begitu ditekan. Dimatikan lewat saklar yang memang
  # sudah dirancang buat ini (`PINDAI_LEMBAR=false`), jadi tombolnya nggak
  # digambar: lebih baik fiturnya nggak kelihatan daripada kelihatan lalu gagal.
  #
  # Yang lain jalan normal — `flutter_secure_storage`, Firebase, notifikasi,
  # `file_picker`, `connectivity_plus`, dan `url_launcher` semuanya punya
  # implementasi web terdaftar.
  web:
    # Syarat yang sama persis dengan job `build` — alasannya ditulis di sana.
    if: >-
      github.event_name != 'workflow_run'
      || (github.event.workflow_run.event == 'workflow_dispatch'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    name: web

    steps:
      # `ref` disamakan dengan job `build` — alasannya ditulis di sana. Bundel
      # web ikut diterbitkan ke situs yang sama, jadi dia harus lahir dari
      # commit yang sama dengan kedua paket desktop.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      # Penjagaan yang SAMA persis dengan jalur desktop, dan alasannya sama:
      # nilai kosong bikin `AppConfig` balik ke `10.0.2.2` (alamat emulator
      # Android), yang dari browser nggak nyambung ke mana-mana.
      - name: Pastiin URL server udah dipasang
        env:
          URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$URL" ] || [[ "$URL" == *"<"* ]]; then
            echo "::error::Repository variable API_BASE_URL belum dipasang atau masih placeholder. Settings -> Secrets and variables -> Actions -> Variables."
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter gen-l10n

      # `--base-href=/app/` WAJIB dan nggak boleh dilupa: tanpa itu semua aset
      # dicari di akar situs (`/main.dart.js`), sementara berkasnya duduk di
      # `/app/main.dart.js`. Hasilnya halaman putih tanpa satu pun pesan error
      # yang nunjuk sebabnya.
      - name: Build web
        run: >
          flutter build web --release
          --base-href=/app/
          --dart-define=APP_ENV=prod
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}/api
          --dart-define=PINDAI_LEMBAR=false

      - uses: actions/upload-artifact@v4
        with:
          name: sidik-web
          path: build/web
          if-no-files-found: error
          retention-days: 30

  terbitkan:
    # Nggak perlu `if:` sendiri: begitu `build` dan `web` dilewati, job ini ikut
    # dilewati — itu perilaku bawaan `needs`.
    needs: [build, web]
    runs-on: ubuntu-latest
    name: terbitkan halaman unduh

    # `needs: build` cuma lanjut kalau job `build` sukses. Dengan
    # `fail-fast: false` di atas, satu platform gagal bikin platform satunya
    # tetap selesai dan artefaknya tetap bisa diunduh dari tab Actions — tapi
    # hasil job-nya tetap merah, jadi langkah ini nggak jalan.
    #
    # Itu disengaja: `firebase deploy` MENGGANTI seluruh isi situs, bukan
    # nambahin. Nerbitkan pas cuma satu zip yang jadi bikin tombol platform
    # satunya jadi 404 — halaman kelihatan normal, tombolnya yang mati. Lebih
    # baik yang lama tetap tayang sampai perbaikannya mendarat.
    steps:
      # `ref` disamakan dengan dua job di atas. Yang di-checkout di sini isi
      # `public/` — halaman unduh yang benar-benar terbit — jadi commit yang
      # salah di sini menerbitkan halaman versi lain berikut ketiga tombolnya.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      # Dicek duluan, sebelum ngunduh apa-apa: kalau rahasianya belum dipasang,
      # bilang cara masangnya — jangan biarin action Firebase-nya gagal dengan
      # "invalid credentials" yang nggak nunjuk ke mana-mana.
      #
      # Secret yang SAMA dipakai jalur APK buat App Distribution, jadi kalau
      # yang itu udah jalan, yang ini nggak butuh apa-apa lagi.
      - name: Pastiin kredensial Firebase udah dipasang
        env:
          KUNCI: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$KUNCI" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT belum dipasang. Firebase Console → Project settings → Service accounts → Generate new private key, lalu: gh secret set FIREBASE_SERVICE_ACCOUNT < kunci-yang-diunduh.json"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: unduhan

      # Zip rilis TIDAK di-commit (lihat .gitignore) — berkasnya cuma numpang
      # lewat di runner. Yang di-commit cuma halaman unduhnya.
      - name: Kumpulin dua zip + bundel web ke situs
        run: |
          cp unduhan/sidik-desktop-windows/sidik-windows.zip public/
          cp unduhan/sidik-desktop-macos/sidik-macos.zip public/

          # Web app duduk di SUBPATH `/app`, halaman unduh tetap di akar.
          # Dirakit di sini, bukan di-deploy sendiri, karena `firebase deploy`
          # mengganti seluruh isi situs — dua deploy terpisah bikin yang satu
          # menghapus yang lain.
          rm -rf public/app
          mkdir -p public/app
          cp -R unduhan/sidik-web/. public/app/

          # Gagal keras kalau bundelnya nggak utuh. Tanpa cek ini situsnya
          # tetap terbit dengan `/app` yang isinya separuh — halaman putih,
          # nol pesan, dan yang bikin ketahuan cuma ada yang nyoba buka.
          test -f public/app/index.html || {
            echo "::error::Bundel web nggak lengkap: public/app/index.html nggak ada."
            exit 1
          }
          grep -q '<base href="/app/">' public/app/index.html || {
            echo "::error::base href bundel web bukan /app/ — asetnya bakal dicari di akar situs dan halamannya putih."
            exit 1
          }

          ls -lh public/
          du -sh public/app

      # Android sengaja NGGAK ikut ke sini. APK-nya jalan lewat App
      # Distribution di `apk-rilis-cloud.yml`, yang ngirim notifikasi ke grup
      # `teknisi` dan bikin build baru masuk sendiri ke HP yang udah pasang App
      # Tester. Nyalin APK ke situs ini cuma bikin dua sumber kebenaran, dan
      # yang satu pasti ketinggalan.
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: sidik-kalibrasi
          channelId: live
