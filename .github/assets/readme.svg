<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="SIDIK Kalibrasi Mobile — aplikasi Flutter untuk kalibrasi alat ukur di lapangan. Tiga layar: memindai lembar kerja, review wajib sebelum simpan, lalu kirim ke API.">
  <title>SIDIK Kalibrasi — Mobile</title>
  <desc>Tiga layar berurutan. Satu: kamera memindai lembar kerja, sel yang terbaca dikotaki biru, satu sel amber karena keyakinannya tidak diketahui. Dua: review wajib — satu sel masih kosong, dan tombol lanjut mati. Tiga: semua lengkap, tombol kirim hidup.</desc>

  <defs>
    <style>
      /* ══════════════════════════════════════════════════════════════════
         PALET — SATU-SATUNYA TEMPAT WARNA DITENTUKAN DI BERKAS INI.
         Mau ganti tampilan? Ubah di sini saja, jangan di bawah.
         Sengaja kembar dengan .github/assets/readme.svg di repo
         sidik-calibration-api, supaya dua repo satu proyek sekeluarga.

         UKURAN TEKS — jangan diperkecil tanpa menghitung.
         GitHub merender README selebar sekitar 818px, sedangkan viewBox ini
         1200, jadi semua menyusut ke 0,68x. font-size 8 tampil 5,4px dan tidak
         terbaca; versi pertama berkas ini jatuh persis di lubang itu. Angka
         terkecil yang dipakai sekarang 13 (tampil 8,8px).
         ══════════════════════════════════════════════════════════════════ */
      .latar   { fill: #f7f5ef; }
      .judul   { fill: #12171f; }
      .data    { fill: #2f4a6d; }
      .teks    { fill: #4b5563; }
      .samar   { fill: #6b7480; }
      .redup   { fill: #8d95a1; }
      .aksen   { fill: #9a6a24; }
      .lolos   { fill: #4a7345; }

      .layar     { fill: #ffffff; }
      .badan     { fill: #ffffff; }
      .tebal     { fill: #d3cdbf; }
      .isi-samar { fill: #e7e3d8; }

      .g-garis { stroke: #c2bcae; }
      .g-halus { stroke: #d8d3c6; }
      .g-titik { stroke: #3f6ea8; }
      .g-aksen { stroke: #9a6a24; }
      .g-lolos { stroke: #4a7345; }
      .f-titik { fill:   #3f6ea8; }
      /* ══════════════════════════════════════════════════════════════════ */

      .sans { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }

      /* Gerak di berkas ini HIASAN semua. Tidak ada satu pun teks, angka, atau
         bidang yang baru terlihat karena animasi. */
      @keyframes pindai { 0% { transform: translateY(0); opacity: 0; }
                         12% { opacity: 1; }
                         88% { opacity: 1; }
                        100% { transform: translateY(430px); opacity: 0; } }
      @keyframes tera   { 0%,100% { opacity: .45; } 50% { opacity: 1; } }

      .pindai { animation: pindai 4.5s cubic-bezier(.45,0,.55,1) infinite; }
      .tera   { animation: tera 2.8s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .tera { animation: none; }
        .pindai { animation: none; opacity: 1; }
      }
    </style>

    <pattern id="milimeter" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0 H0 V20" fill="none" stroke="#2f4a6d" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <pattern id="milimeterBesar" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0 H0 V100" fill="none" stroke="#2f4a6d" stroke-opacity="0.13" stroke-width="1"/>
    </pattern>

    <linearGradient id="berkas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3f6ea8" stop-opacity="0"/>
      <stop offset="70%"  stop-color="#3f6ea8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#3f6ea8" stop-opacity="0.5"/>
    </linearGradient>

    <clipPath id="layarPindai"><rect x="18" y="52" width="264" height="476" rx="18"/></clipPath>
  </defs>

  <rect class="latar" width="1200" height="900"/>
  <rect width="1200" height="900" fill="url(#milimeter)"/>
  <rect width="1200" height="900" fill="url(#milimeterBesar)"/>

  <!-- ═══════════════════ identitas ═══════════════════ -->
  <g transform="translate(90, 96)">
    <text class="mono aksen" x="0" y="0" font-size="13" letter-spacing="3.2">LK-285-IDN</text>
    <line class="g-aksen" x1="110" y1="-5" x2="164" y2="-5" stroke-opacity="0.4"/>
    <text class="mono samar" x="176" y="0" font-size="13" letter-spacing="1.6">SATU APK, TEKNISI DAN ADMIN</text>

    <text class="sans judul" x="-2" y="56" font-size="46" font-weight="650" letter-spacing="-1">SIDIK Kalibrasi Mobile</text>
    <text class="sans teks"  x="0"  y="92" font-size="17">Aplikasi lapangan: pindai lembar kerja, review, kirim ke API</text>

    <line class="g-halus" x1="0" y1="122" x2="1020" y2="122"/>

    <text class="mono samar" x="0" y="148" font-size="14">
      <tspan class="data">Flutter 3.44.6</tspan><tspan fill="#a8a293">   ·   </tspan>Dart 3.11<tspan fill="#a8a293">   ·   </tspan>Riverpod 3<tspan fill="#a8a293">   ·   </tspan>ML Kit di perangkat
    </text>
  </g>

  <!-- ═══════════════════ 01 — pindai ═══════════════════ -->
  <g transform="translate(90, 306)">
    <text class="mono redup"  x="0"  y="-44" font-size="14">01</text>
    <text class="sans judul"  x="30" y="-44" font-size="17" font-weight="600">Pindai lembar kerja</text>
    <text class="sans samar"  x="0"  y="-20" font-size="14">ML Kit jalan di perangkat, bukan dikirim ke server</text>

    <rect class="tebal" x="12" y="12" width="300" height="560" rx="32"/>
    <rect class="badan" x="0" y="0" width="300" height="560" rx="32"/>
    <rect class="g-garis" x="0.5" y="0.5" width="299" height="559" rx="32" fill="none"/>
    <rect class="isi-samar" x="120" y="26" width="60" height="7" rx="3.5"/>
    <rect class="layar" x="18" y="52" width="264" height="476" rx="18"/>
    <rect class="g-halus" x="18.5" y="52.5" width="263" height="475" rx="18" fill="none"/>

    <g clip-path="url(#layarPindai)">
      <g class="g-halus">
        <line x1="40" y1="110" x2="270" y2="110"/><line x1="40" y1="174" x2="270" y2="174"/>
        <line x1="40" y1="238" x2="270" y2="238"/><line x1="40" y1="302" x2="270" y2="302"/>
        <line x1="40" y1="366" x2="270" y2="366"/><line x1="40" y1="430" x2="270" y2="430"/>
        <line x1="118" y1="86" x2="118" y2="470"/><line x1="196" y1="86" x2="196" y2="470"/>
      </g>
      <g class="mono redup" font-size="13">
        <text x="46" y="100">TITIK</text><text x="126" y="100">STD</text><text x="204" y="100">UUT</text>
      </g>

      <g class="mono samar" font-size="15">
        <text x="46" y="146">1</text><text x="46" y="210">2</text>
        <text x="46" y="274">3</text><text x="46" y="338">4</text>
      </g>

      <g class="g-titik" fill="none" stroke-width="1.6">
        <rect x="122" y="118" width="70" height="40" rx="4"/>
        <rect x="200" y="118" width="66" height="40" rx="4"/>
        <rect x="122" y="182" width="70" height="40" rx="4"/>
        <rect x="200" y="246" width="66" height="40" rx="4"/>
        <rect x="122" y="310" width="70" height="40" rx="4"/>
      </g>
      <g class="mono data" font-size="16">
        <text x="130" y="145">7.01</text><text x="208" y="145">7.03</text>
        <text x="130" y="209">4.00</text><text x="208" y="273">4.02</text>
        <text x="130" y="337">10.01</text>
      </g>

      <rect class="g-aksen tera" x="200" y="182" width="66" height="40" rx="4" fill="none" stroke-width="2"/>
      <text class="mono aksen" x="208" y="209" font-size="16">4.0?</text>

      <rect class="pindai" x="18" y="60" width="264" height="48" fill="url(#berkas)"/>

      <g class="g-titik" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.65">
        <path d="M38 86 v-18 h18"/><path d="M272 86 v-18 h-18"/>
        <path d="M38 470 v18 h18"/><path d="M272 470 v18 h-18"/>
      </g>
    </g>

    <text class="mono aksen" x="30" y="556" font-size="14">1 sel keyakinannya tidak diketahui</text>
  </g>

  <!-- ═══════════════════ 02 — review wajib ═══════════════════ -->
  <g transform="translate(450, 306)">
    <text class="mono redup"  x="0"  y="-44" font-size="14">02</text>
    <text class="sans judul"  x="30" y="-44" font-size="17" font-weight="600">Review wajib</text>
    <text class="sans samar"  x="0"  y="-20" font-size="14">tombol mati selama masih ada sel kosong</text>

    <rect class="tebal" x="12" y="12" width="300" height="560" rx="32"/>
    <rect class="badan" x="0" y="0" width="300" height="560" rx="32"/>
    <rect class="g-garis" x="0.5" y="0.5" width="299" height="559" rx="32" fill="none"/>
    <rect class="isi-samar" x="120" y="26" width="60" height="7" rx="3.5"/>
    <rect class="layar" x="18" y="52" width="264" height="476" rx="18"/>
    <rect class="g-halus" x="18.5" y="52.5" width="263" height="475" rx="18" fill="none"/>

    <text class="sans judul" x="40" y="94" font-size="16" font-weight="600">Review sebelum simpan</text>
    <line class="g-halus" x1="40" y1="110" x2="260" y2="110"/>

    <g class="mono" font-size="15">
      <text class="samar" x="40" y="146">Titik 1</text><text class="data" x="172" y="146">7.01 / 7.03</text>
      <text class="samar" x="40" y="186">Titik 2</text><text class="data" x="172" y="186">4.00 / 4.02</text>
      <text class="samar" x="40" y="226">Titik 3</text><text class="aksen" x="172" y="226">10.01 / —</text>
      <text class="samar" x="40" y="266">Suhu</text><text class="data" x="172" y="266">24.6 °C</text>
      <text class="samar" x="40" y="306">Lembap</text><text class="data" x="172" y="306">58 %RH</text>
    </g>

    <rect class="g-aksen" x="32" y="208" width="236" height="28" rx="5" fill="none" stroke-opacity="0.8" stroke-width="1.6"/>
    <circle class="aksen tera" cx="258" cy="222" r="4"/>

    <text class="mono aksen" x="40" y="360" font-size="14">1 sel belum terisi</text>

    <rect class="isi-samar" x="40" y="430" width="220" height="52" rx="12"/>
    <text class="sans redup" x="150" y="462" font-size="16" text-anchor="middle">Lanjut</text>

    <text class="sans samar" x="30" y="556" font-size="14">manusia yang memutuskan, bukan OCR</text>
  </g>

  <!-- ═══════════════════ 03 — kirim ═══════════════════ -->
  <g transform="translate(810, 306)">
    <text class="mono redup"  x="0"  y="-44" font-size="14">03</text>
    <text class="sans judul"  x="30" y="-44" font-size="17" font-weight="600">Kirim ke API</text>
    <text class="sans samar"  x="0"  y="-20" font-size="14">satu pipeline dengan input manual</text>

    <rect class="tebal" x="12" y="12" width="300" height="560" rx="32"/>
    <rect class="badan" x="0" y="0" width="300" height="560" rx="32"/>
    <rect class="g-garis" x="0.5" y="0.5" width="299" height="559" rx="32" fill="none"/>
    <rect class="isi-samar" x="120" y="26" width="60" height="7" rx="3.5"/>
    <rect class="layar" x="18" y="52" width="264" height="476" rx="18"/>
    <rect class="g-halus" x="18.5" y="52.5" width="263" height="475" rx="18" fill="none"/>

    <text class="sans judul" x="40" y="94" font-size="16" font-weight="600">Siap dikirim</text>
    <line class="g-halus" x1="40" y1="110" x2="260" y2="110"/>

    <g class="mono samar" font-size="15">
      <text x="72" y="150">Titik 1</text><text x="72" y="192">Titik 2</text>
      <text x="72" y="234">Titik 3</text><text x="72" y="276">Lingkungan</text>
      <text x="72" y="318">Identitas alat</text>
    </g>
    <g class="g-lolos" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M42 145 l6 6 l10 -12"/><path d="M42 187 l6 6 l10 -12"/>
      <path d="M42 229 l6 6 l10 -12"/><path d="M42 271 l6 6 l10 -12"/>
      <path d="M42 313 l6 6 l10 -12"/>
    </g>

    <text class="mono samar" x="40" y="372" font-size="14">POST lewat token Sanctum</text>

    <rect class="f-titik" x="40" y="430" width="220" height="52" rx="12"/>
    <text class="sans" x="150" y="462" font-size="16" fill="#ffffff" text-anchor="middle">Kirim</text>

    <text class="sans samar" x="30" y="556" font-size="14">angkanya dihitung ulang di server</text>
  </g>
</svg>
