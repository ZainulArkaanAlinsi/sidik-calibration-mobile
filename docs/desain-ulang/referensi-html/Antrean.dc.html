<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Antrean approval</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<style>
body{margin:0}
button,input{font:inherit;color:inherit}
a{color:#0F4F94}a:hover{color:#0B2545}
@keyframes naik{from{opacity:0;translate:0 12px}to{opacity:1;translate:0 0}}
a,button{transition:scale 120ms cubic-bezier(.33,1,.68,1),background-color 120ms}a:active,button:active{scale:.97}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 960px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; background: #F3F7FB; color: #0B2545; font-family: 'Inter', system-ui, sans-serif; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 12px; min-height: 48px">
  <a href="BerandaAdmin.dc.html" aria-label="Kembali" style="width: 48px; height: 48px; border-radius: 24px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B2545" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></a>
  <div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">
    <h1 style="margin: 0; font-size: 20px; line-height: 26px; font-weight: 800">Antrean approval</h1>
  </div>
</header>

  <section style="margin-top: 16px; padding: 18px; border-radius: 28px; background: #0B2545; color: #FFFFFF; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; animation: naik 240ms cubic-bezier(0.33,1,0.68,1) 0ms both">
    <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 36px; line-height: 40px; font-weight: 800">4</span><span style="font-size: 12px; color: #C3D6EC">menunggu</span></div>
    <div style="display: flex; flex-direction: column; gap: 2px; padding-left: 12px; border-left: 1px solid #2A4468"><span style="font-size: 36px; line-height: 40px; font-weight: 800; color: #F6D36B">1</span><span style="font-size: 12px; color: #C3D6EC">ada FAIL</span></div>
    <div style="display: flex; flex-direction: column; gap: 2px; padding-left: 12px; border-left: 1px solid #2A4468"><span style="font-size: 36px; line-height: 40px; font-weight: 800; color: #A9D8FB">2</span><span style="font-size: 12px; color: #C3D6EC">teknisi</span></div>
  </section>

  <div role="group" aria-label="Saring" style="margin: 12px -16px 0 0; display: flex; gap: 8px; overflow-x: auto">
    <sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
      <button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="flex-shrink: 0; height: 44px; padding: 0 6px 0 16px; display: flex; align-items: center; gap: 8px; border: 0; border-radius: 22px; background: {{c.bg}}; color: {{c.fg}}; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap">{{c.label}} <span style="width: 32px; height: 32px; border-radius: 16px; background: {{c.nbg}}; color: #0B2545; display: flex; align-items: center; justify-content: center">{{c.n}}</span></button>
    </sc-for>
  </div>

  <div style="margin-top: 14px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="4">
      <article style="position: relative; padding: 16px; border-radius: 24px; background: #FFFFFF; display: flex; flex-direction: column; gap: 10px; overflow: hidden; animation: naik 240ms cubic-bezier(0.33,1,0.68,1) {{it.delay}} both">
        <div style="display: flex; gap: 12px; align-items: center">
          <span style="width: 52px; height: 52px; border-radius: 18px; background: #E4F2FD; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><img src="{{it.img}}" alt="" style="width: 50px; height: 50px"></span>
          <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
            <span style="font-size: 16px; font-weight: 800">{{it.name}}</span>
            <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; font-weight: 600; color: #4A5D78">{{it.no}}</span>
          </div>
          <sc-if value="{{it.fail}}" hint-placeholder-val="{{ false }}">
            <span style="flex-shrink: 0; height: 30px; padding: 0 10px; display: flex; align-items: center; gap: 4px; border-radius: 15px; background: #F2957A; font-size: 12px; font-weight: 700">1 FAIL</span>
          </sc-if>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
          <span style="font-size: 13px; line-height: 18px; color: #4A5D78; min-width: 0">{{it.pt}}<br>oleh {{it.by}}</span>
          <a href="Periksa.dc.html" style="flex-shrink: 0; height: 44px; padding: 0 16px; display: flex; align-items: center; gap: 6px; border-radius: 22px; background: #1C6FC4; color: #FFFFFF; font-size: 14px; font-weight: 700; text-decoration: none">Periksa
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </a>
        </div>
      </article>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":960}}'>
class Component extends DCLogic {
  state = { f: 'Semua PT' };
  renderVals() {
    const all = [
      { name: 'pH Meter', no: 'KAL/2026/11/0001', pt: 'PT Tirta Contoh Makmur', by: 'Zainul', img: '/_blob/2a5cf405f41c14fb8fc490759a9fa808', fail: true },
      { name: 'Thermohygrometer', no: 'KAL/2026/11/0004', pt: 'PT. Perkebunan Contoh', by: 'Zainul', img: '/_blob/7faeffbe5b1225279adf68f844a06077', fail: false },
      { name: 'Autoclave', no: 'KAL/2026/11/0005', pt: 'LPKL PDAM Kota Contoh', by: 'Rekan teknisi', img: '/_blob/8e54ee781f81a79f6b985dfaf006601b', fail: false },
      { name: 'Pipet Ukur', no: 'KAL/2026/11/0006', pt: 'PT Tirta Contoh Makmur', by: 'Rekan teknisi', img: '/_blob/0d9c1bb373a8c00e1d8f2343f7753c74', fail: false },
    ];
    const f = this.state.f;
    const defs = [
      { label: 'Semua PT', n: 4, nbg: '#F6D36B', test: () => true },
      { label: 'Ada FAIL', n: 1, nbg: '#F2957A', test: (x) => x.fail },
      { label: 'PT Tirta Contoh', n: 2, nbg: '#E4F2FD', test: (x) => x.pt.startsWith('PT Tirta') },
    ];
    const cur = defs.find((d) => d.label === f);
    return {
      chips: defs.map((d) => ({
        ...d,
        pressed: d.label === f ? 'true' : 'false',
        bg: d.label === f ? '#0B2545' : '#FFFFFF',
        fg: d.label === f ? '#FFFFFF' : '#0B2545',
        pick: () => this.setState({ f: d.label }),
      })),
      items: all.filter(cur.test).map((x, i) => ({ ...x, delay: Math.min(35 * (i + 1), 210) + 'ms' })),
    };
  }
}
</script>
</body>
</html>
