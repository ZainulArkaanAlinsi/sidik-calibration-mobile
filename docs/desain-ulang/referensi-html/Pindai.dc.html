<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Cek hasil pindai</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&family=Caveat:wght@600&display=swap">
<style>
body{margin:0}
button,input{font:inherit;color:inherit}
a{color:#0F4F94}a:hover{color:#0B2545}
@keyframes naik{from{opacity:0;translate:0 12px}to{opacity:1;translate:0 0}}
a,button{transition:scale 120ms cubic-bezier(.33,1,.68,1),background-color 120ms}a:active,button:active{scale:.97}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 960px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; background: #F3F7FB; color: #0B2545; font-family: 'Inter', system-ui, sans-serif; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 12px; height: 48px">
    <a href="LembarKerja.dc.html" aria-label="Kembali ke lembar kerja" style="width: 48px; height: 48px; border-radius: 24px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0B2545" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    </a>
    <h1 style="margin: 0; font-size: 20px; line-height: 26px; font-weight: 800; flex-grow: 1">Cek hasil pindai</h1>
  </header>

  <section style="margin-top: 16px; position: relative; padding: 18px; border-radius: 24px; background: #5BB4F5; display: flex; flex-direction: column; gap: 10px; overflow: hidden">
    <svg aria-hidden="true" width="220" height="90" viewBox="0 0 300 120" fill="none" style="position: absolute; right: -40px; top: -20px; opacity: .45"><g fill="none" stroke="#FFFFFF" stroke-linecap="round"><path d="M190 120A110 110 0 0 1 300 10" stroke-width="3"/><path d="M214 120A86 86 0 0 1 300 34" stroke-width="1.5" stroke-dasharray="2 6"/><path d="M300.0 10.0L300.0 26.0" stroke-width="3"/><path d="M288.5 10.6L289.3 18.6" stroke-width="2"/><path d="M277.1 12.4L278.8 20.2" stroke-width="2"/><path d="M266.0 15.4L268.5 23.0" stroke-width="2"/><path d="M255.3 19.5L258.5 26.8" stroke-width="2"/><path d="M245.0 24.7L253.0 38.6" stroke-width="3"/><path d="M235.3 31.0L240.0 37.5" stroke-width="2"/><path d="M226.4 38.3L231.7 44.2" stroke-width="2"/><path d="M218.3 46.4L224.2 51.7" stroke-width="2"/><path d="M211.0 55.3L217.5 60.0" stroke-width="2"/><path d="M204.7 65.0L218.6 73.0" stroke-width="3"/><path d="M199.5 75.3L206.8 78.5" stroke-width="2"/><path d="M195.4 86.0L203.0 88.5" stroke-width="2"/><path d="M192.4 97.1L200.2 98.8" stroke-width="2"/><path d="M190.6 108.5L198.6 109.3" stroke-width="2"/><path d="M190.0 120.0L206.0 120.0" stroke-width="3"/><path d="M300 120L245.0 70.5" stroke-width="4"/><path d="M0 118H180" stroke-width="2.5"/><path d="M0 118V104" stroke-width="2.5"/><path d="M10 118V111" stroke-width="1.6"/><path d="M20 118V111" stroke-width="1.6"/><path d="M30 118V111" stroke-width="1.6"/><path d="M40 118V111" stroke-width="1.6"/><path d="M50 118V104" stroke-width="2.5"/><path d="M60 118V111" stroke-width="1.6"/><path d="M70 118V111" stroke-width="1.6"/><path d="M80 118V111" stroke-width="1.6"/><path d="M90 118V111" stroke-width="1.6"/><path d="M100 118V104" stroke-width="2.5"/><path d="M110 118V111" stroke-width="1.6"/><path d="M120 118V111" stroke-width="1.6"/><path d="M130 118V111" stroke-width="1.6"/><path d="M140 118V111" stroke-width="1.6"/><path d="M150 118V104" stroke-width="2.5"/><path d="M160 118V111" stroke-width="1.6"/><path d="M170 118V111" stroke-width="1.6"/><path d="M180 118V111" stroke-width="1.6"/></g><circle cx="300" cy="120" r="9" fill="#FFFFFF"/></svg>
    <span style="position: relative; font-size: 14px; font-weight: 700">Titik pH 7,00</span>
    <div style="position: relative; display: flex; flex-wrap: wrap; gap: 6px">
      <span style="height: 30px; padding: 0 12px; display: flex; align-items: center; border-radius: 15px; background: #FFFFFF; font-size: 12px; font-weight: 700">5 sel dibaca</span>
      <span style="height: 30px; padding: 0 12px; display: flex; align-items: center; border-radius: 15px; background: #F6D36B; font-size: 12px; font-weight: 700">{{perlu}} perlu dicek</span>
      <span style="height: 30px; padding: 0 12px; display: flex; align-items: center; border-radius: 15px; background: #F2957A; font-size: 12px; font-weight: 700">1 tidak terbaca</span>
    </div>
    <p style="position: relative; margin: 0; font-size: 13px; line-height: 18px; font-weight: 500; max-width: 300px">Tulisan tangan tidak pernah ditandai aman otomatis. Cocokkan angka dengan potongan foto di sebelahnya.</p>
  </section>

  <div style="margin-top: 12px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
      <div style="padding: 12px; border-radius: 22px; background: #FFFFFF; display: flex; gap: 12px; align-items: center; animation: naik 240ms cubic-bezier(0.33,1,0.68,1) {{r.delay}} both">
        <div role="img" aria-label="{{r.photoAria}}" style="position: relative; width: 92px; height: 64px; flex-shrink: 0; border-radius: 12px; background: #F7F4EA; border: 1px solid #E3DDCB; overflow: hidden; display: flex; align-items: center; justify-content: center">
          <span aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 14px; height: 1px; background: #C9D8E8"></span>
          <span aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 14px; height: 1px; background: #C9D8E8"></span>
          <span aria-hidden="true" style="position: absolute; top: 0; bottom: 0; left: 8px; width: 1px; background: #C9D8E8"></span>
          <span aria-hidden="true" style="position: relative; font-family: 'Caveat', cursive; font-size: 30px; color: #1F3B8C; rotate: {{r.tilt}}">{{r.hand}}</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1; min-width: 0">
          <span style="font-size: 12px; font-weight: 700; color: #4A5D78">Repeat {{r.n}}</span>
          <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 20px; font-weight: 700">{{r.read}}</span>
          <span style="font-size: 12px; line-height: 16px; color: #4A5D78">{{r.why}}</span>
        </div>
        <sc-if value="{{r.used}}" hint-placeholder-val="{{ false }}">
          <span style="flex-shrink: 0; height: 30px; padding: 0 10px; display: flex; align-items: center; gap: 4px; border-radius: 15px; background: #BFE6C4; font-size: 12px; font-weight: 700">
            <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
            Dipakai
          </span>
        </sc-if>
        <sc-if value="{{r.canUse}}" hint-placeholder-val="{{ true }}">
          <button type="button" onClick="{{r.use}}" style="flex-shrink: 0; height: 44px; padding: 0 14px; border: 0; border-radius: 22px; background: #1C6FC4; color: #FFFFFF; font-size: 13px; font-weight: 700; cursor: pointer">Pakai</button>
        </sc-if>
        <sc-if value="{{r.manual}}" hint-placeholder-val="{{ false }}">
          <a href="LembarKerja.dc.html" style="flex-shrink: 0; height: 44px; padding: 0 14px; display: flex; align-items: center; border-radius: 22px; background: #F2957A; color: #0B2545; font-size: 13px; font-weight: 700; text-decoration: none">Ketik</a>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <a href="LembarKerja.dc.html" style="margin-top: auto; height: 56px; padding: 0 8px 0 22px; display: flex; align-items: center; justify-content: space-between; border-radius: 28px; background: #0B2545; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none">
    Kembali ke lembar kerja
    <span style="height: 40px; padding: 0 14px; border-radius: 20px; background: #FFFFFF; color: #0B2545; display: flex; align-items: center; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 14px; font-weight: 700">{{done}}/5</span>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":960}}'>
class Component extends DCLogic {
  state = { used: [true, false, false, false, false] };
  renderVals() {
    const base = [
      { hand: '7,01', read: '7,01', why: 'Cocok dengan rentang titik ini', tilt: '-3deg' },
      { hand: '7,02', read: '7,02', why: 'Ada huruf yang ditebak jadi angka', tilt: '2deg' },
      { hand: '7,0l', read: '7,01', why: 'Ada huruf yang ditebak jadi angka', tilt: '-2deg' },
      { hand: '7,9', read: '7,9', why: 'Angkanya jauh beda dari Repeat lain di baris ini', tilt: '3deg' },
      { hand: '~', read: '—', why: 'Tidak terbaca. Ketik manual di lembar kerja.', tilt: '0deg', unread: true },
    ];
    const u = this.state.used;
    const rows = base.map((b, i) => ({
      ...b,
      n: i + 1,
      delay: Math.min(i * 35, 210) + 'ms',
      photoAria: 'Potongan foto Repeat ' + (i + 1),
      used: u[i],
      canUse: !u[i] && !b.unread,
      manual: !!b.unread,
      use: () => { const x = u.slice(); x[i] = true; this.setState({ used: x }); },
    }));
    const done = u.filter(Boolean).length;
    return { rows, done, perlu: rows.filter((r) => r.canUse).length };
  }
}
</script>
</body>
</html>
